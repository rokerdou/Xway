[workspace]
members = ["server", "client", "shared", "client-core", "client-gui/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["doujia"]
license = "MIT"

[workspace.dependencies]
# 异步运行时
tokio = { version = "1.35", features = ["full"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }

# 配置
toml = "0.8"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# 加密
aes-gcm = "0.10"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
