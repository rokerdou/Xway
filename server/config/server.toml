# 服务端配置

[server]
listen_addr = "0.0.0.0"
listen_port = 1080
max_connections = 1000
timeout_seconds = 300
handshake_timeout_seconds = 10

[logging]
level = "info"
log_dir = "./logs"
max_log_files = 7

[auth]
enabled = true
# 生产环境通过 XWAY_SHARED_SECRET 注入，至少 16 字节。
shared_secret = ""
max_time_diff_secs = 300

[relay]
max_buffer_size = 8192
enable_traffic_stats = true
